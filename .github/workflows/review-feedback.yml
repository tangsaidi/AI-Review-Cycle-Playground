name: Review Feedback Loop

on:
  pull_request:
    types: [closed]

jobs:
  capture-feedback:
    if: |
      contains(github.event.pull_request.labels.*.name, 'auto-approve-eligible') ||
      contains(github.event.pull_request.labels.*.name, 'needs-human-review')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Debug
        run: |
          echo "Feedback workflow triggered"
          echo "PR: ${{ github.event.pull_request.number }}"
          echo "Merged: ${{ github.event.pull_request.merged }}"
